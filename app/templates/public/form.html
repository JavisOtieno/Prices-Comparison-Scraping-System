<!-- templates/form.html -->
{% extends 'base.html' %}

{% block content %}

<h2>Enter Features for Prediction</h2>
<p>
    [5.1, 3.5, 1.4, 0.2],   # Example for Iris Setosa - Output 0</p>
 <p>   [7.0, 3.2, 4.7, 1.4],   # Example for Iris Versicolor - Output 1</p>
    <p>[6.3, 3.3, 6.0, 2.5]    # Example for Iris Virginica - Output 2
</p>
<form action="/predict" method="post">
    <label for="feature1">Feature 1:</label>
    <input type="text" id="feature1" name="feature1" required><br>
    
    <label for="feature2">Feature 2:</label>
    <input type="text" id="feature2" name="feature2" required><br>
    
    <label for="feature3">Feature 3:</label>
    <input type="text" id="feature3" name="feature3" required><br>
    
    <label for="feature4">Feature 4:</label>
    <input type="text" id="feature4" name="feature4" required><br>
    
    <button type="submit">Predict</button>
</form>
{% endblock %}
