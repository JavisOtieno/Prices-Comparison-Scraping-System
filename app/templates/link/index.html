{% extends 'layout.html' %}

{% block content %}

            <!--app-content open-->
            <div class="main-content app-content mt-0">
                <div class="side-app">

                    <!-- CONTAINER -->
                    <div class="main-container container-fluid">

                        <!-- PAGE-HEADER -->
                        <div class="page-header">
                            <h1 class="page-title">Links</h1>
                            <div>
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="javascript:void(0)">Links</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Link</li>
                                </ol>
                            </div>

                        </div>
                        <!-- PAGE-HEADER END -->



                        <!-- Row -->
                        <div class="row row-sm">
                            <div class="col-lg-12">
                                <div class="card">
                                    <!-- <div class="card-header">
                                        <h3 class="card-title">Categories</h3>
                                    </div> -->
                                    <div class="card-header">
                    
                                        <h3 class="card-title">Links</h3>
                                        <a type="button" href="/createlink" class="btn btn-primary col-md-3" style="margin-left: auto;margin-right:20px;margin-top:10px;margin-bottom:10px;color:white;">Add Link</a>
                                    
                                        
                                    </div>
                                    <div class="card-body">
                                        <div class="table-responsive">
                                            <table class="table table-bordered text-nowrap border-bottom" id="responsive-datatable">
                                                <thead>
                                                    <tr>
                                                        <th class="wd-15p border-bottom-0">ID</th>
                                                        <th class="wd-15p border-bottom-0">Link Name</th>
                                                        <th class="wd-15p border-bottom-0">Price</th>
                                                        <th class="wd-15p border-bottom-0">Actual Link</th>
                                                        <th class="wd-25p border-bottom-0">Date</th>
                                                        <th class="wd-25p border-bottom-0">Edit</th>
                                                        <th class="wd-25p border-bottom-0">Delete</th>

                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    
                                                    {% for link in links %}
                                                    <tr>
                                                    <td>{{ link.id }}</td>
                                                    <td><a href="{{ link.link }}" target="_blank">{{ link.name }}</a></td>
                                                    <td>{{ link.price }}</td>
                                                    <td>{{ link.link }}</td>
                                                    <td>{{ link.created_at }}</td>
                                                    <td><a class="btn btn-info" href="/editlink/{{ link.id }}">Edit</a></td>
                                                    <td><a class="btn btn-danger" href="/deletelink/{{ link.id }}" onclick="return confirm('Are you sure?')">Delete</a></td>
                                                </tr>
                                                {% endfor %}
                                                    </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- End Row -->

       

                    </div>
                    <!-- CONTAINER CLOSED -->

                </div>
            </div>
            <!--app-content closed-->

{% endblock %}
